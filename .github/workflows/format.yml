name: Format

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  oxfmt:
    name: oxfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check
